# Vale configuration for this repository's human-facing prose.
#
# Vale (https://vale.sh) checks style, not spelling. CI runs
# `vale --minAlertLevel=error .` in the `prose` job. Locally:
#
#   vale sync                                     # download the style packages
#   vale --glob='!{.fetched,site,styles}/**' .    # lint this repo's own prose
#
# The glob matters locally: `.fetched/` (product docs pulled in by `make sync`),
# `site/` and `styles/` are generated, and a section below cannot exclude them —
# Vale merges section settings rather than subtracting, so `BasedOnStyles =` in a
# narrower section never removes a package a broader one already applied. CI has
# none of those directories, but passes the same glob so both runs agree.
#
# Adapted from the docs-editing reference config, matching the sibling setup in
# cadasto/plugin-marketplace so a contributor moving between the two repositories
# meets the same rules. StylesPath is gitignored — the packages are downloadable,
# not source. The vocabulary is in-repo, because the vocabulary *is* source.

StylesPath = styles
MinAlertLevel = suggestion

# Google's developer-documentation style guide is the closest public match to the
# house style, and its rules are well-maintained. write-good catches passive voice,
# weasel words and hedges; alex catches insensitive phrasing; proselint catches
# clichés and redundancy. Microsoft's package is an alternative to Google's — enable
# one or the other, never both (their rules contradict on person and contractions).
Packages = Google, write-good, alex, proselint

# Project terminology and accepted spellings, in
# styles/config/vocabularies/Cadasto/{accept,reject}.txt. The directory must exist
# and match this name: a `Vocab` with no matching directory is a hard error
# (`E100 [vocab]`, exit 2). `accept.txt` keeps openEHR's own capitalisation and the
# domain jargon from being "corrected"; `reject.txt` holds banned marketing
# vocabulary, so the linter catches it rather than a reviewer.
Vocab = Cadasto

[*.{md,mdx,markdown}]
BasedOnStyles = Vale, Google, write-good, alex, proselint

# --- Deliberate deviations from the Google package -------------------------------
# British spelling in prose; code identifiers keep their own spelling.
Google.Spelling = NO
# Semantic line breaks are welcome here, so sentence-per-line triggers false positives.
Google.Parens = NO
# The house style permits spaced em dashes for parenthetical breaks.
Google.EmDash = NO
# Google's package assumes American punctuation-inside-quotes. The house style is
# British, which places the comma or period outside unless it belongs to the quote,
# so this rule fires on correct prose.
Google.Quotes = NO
# Headings are sentence case, which Google's package already enforces — keep it on.
Google.Headings = YES
# "we" is disallowed in reference docs but legitimate in marketing copy; enforce by
# review rather than globally, since Vale cannot tell the two contexts apart.
Google.We = suggestion

# E-Prime objects to every form of "to be", which reference documentation is built
# on ("the plugin is the workflow layer", "`docs_dir` is `pages/`"). It is a writing
# exercise, not a style rule.
write-good.E-Prime = NO
# Flags domain vocabulary this site cannot avoid: "hook", "failure", "invasive".
alex.ProfanityUnlikely = NO

# --- Escalations -----------------------------------------------------------------
# These are errors rather than suggestions: future tense where present belongs,
# weasel words, and condescending hedges.
Google.Will = error          # future tense where present tense belongs
write-good.Weasel = error    # "very", "really", "basically"
write-good.Illusions = error # "simply", "just", "obviously"
alex.Condescending = error   # "easy", "simply", "of course"

# Content that is not ours to restyle. AGENTS.md and CLAUDE.md address a model
# rather than a reader, which inverts several of these rules — an imperative
# instruction file is allowed to say "never" and "must", so the escalations above
# are unset explicitly. Because settings merge, the Google and write-good packages
# still report warnings here; only the error-level gate is lifted.
[{AGENTS.md,CLAUDE.md}]
BasedOnStyles = Vale
Google.Will = NO
write-good.Weasel = NO
write-good.Illusions = NO
alex.Condescending = NO

# Product documentation fetched at build time (see sources.json). Canonical in the
# product repositories — AGENTS.md forbids editing it here — so a finding against
# it cannot be acted on. Spelling is off for it, and the `--glob` above skips the
# directory outright; this section is the backstop for a run without the glob.
[.fetched/*]
BasedOnStyles =
Vale.Spelling = NO

# Built output: the same prose again, wrapped in theme HTML.
[site/**]
BasedOnStyles =
Vale.Spelling = NO

# Legal text — flag it in review, never lint it.
[LICENSE]
BasedOnStyles =
Vale.Spelling = NO

# Vendored style packages are downloads, not our prose.
[styles/**]
BasedOnStyles =
Vale.Spelling = NO
