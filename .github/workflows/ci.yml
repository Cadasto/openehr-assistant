name: CI

# Verification only — never publishes. This is the gate on PRs into main, so a
# broken site is caught before the merge that triggers docs-site.yml's deploy.
# `branches` filters on the PR's *base*, so PRs between other branches are not
# built; there is no `push` trigger, so an open PR is checked once per push.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job's name is the required status check protecting main — renaming it
  # silently un-protects the branch, because the rule matches on the name. It is
  # deliberately not `build`: docs-site.yml has a job by that name too, and two
  # check runs called `build` cannot be told apart in the protection rule.
  verify-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # `make check` is `make build` plus the output assertions — strict mode
      # cannot see a missing extra_css target or a template-emitted link, so a
      # green build alone is not proof the site is publishable.
      - name: Build and verify the site
        run: make check

  # Prose linting, deliberately separate from verify-site: a style finding is not
  # a broken site, and mixing them would make one failure look like the other.
  # This job is not in the branch protection rule — only verify-site is — so it
  # reports without blocking while the initial backlog is triaged.
  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Pinned: a new Vale release must not turn a green pull request red on its own.
      VALE_VERSION: 3.18.0
    steps:
      - uses: actions/checkout@v7

      - name: Install Vale
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Downloads the style packages named in .vale.ini; the vocabulary is in-repo.
      - run: vale sync

      # Gates on errors only. Warnings and suggestions are a backlog, not a
      # merge blocker. The glob matches the documented local command so a clean
      # run here means a clean run there; CI checks out none of those
      # directories, but keeping the flag stops the two from drifting apart.
      - run: vale --minAlertLevel=error --glob='!{.fetched,site,styles}/**' .
