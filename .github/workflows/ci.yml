name: CI

# Verification only — never publishes. This is the gate on PRs into main, so a
# broken site is caught before the merge that triggers docs-site.yml's deploy.
# `branches` filters on the PR's *base*, so PRs between other branches are not
# built; there is no `push` trigger, so an open PR is checked once per push.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job's name is the required status check protecting main — renaming it
  # silently un-protects the branch, because the rule matches on the name. It is
  # deliberately not `build`: docs-site.yml has a job by that name too, and two
  # check runs called `build` cannot be told apart in the protection rule.
  verify-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # `make check` is `make build` plus the output assertions — strict mode
      # cannot see a missing extra_css target or a template-emitted link, so a
      # green build alone is not proof the site is publishable.
      - name: Build and verify the site
        run: make check
