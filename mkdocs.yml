site_name: openEHR Assistant
site_url: https://cadasto.github.io/openehr-assistant/
# Fallback only: every page in `nav` carries its own `description` front matter,
# which the theme and the social-card generator both prefer. This is what a page
# added without one would inherit, and what 404.html shows.
site_description: >-
  An openEHR MCP server and a Claude Code and Cursor plugin — archetypes,
  templates, AQL and terminology, grounded in CKM and the published
  specifications.
# The repository surfaced in the header (and its stars/forks) is the product's,
# not this site's — a visitor following it wants the server, not the prose. The
# site's own repository is linked from Contributing.
repo_url: https://github.com/cadasto/openehr-assistant-mcp
repo_name: cadasto/openehr-assistant-mcp
# No `edit_uri`: the theme only renders edit links with the `content.action.edit`
# feature, and pages built from fetched content would point at the wrong repo.

docs_dir: pages

# Warnings are build failures. Both `make build` and CI rely on this rather
# than passing --strict, so the two can never diverge.
strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # Dark is the default (listed first); the header toggle switches to light and
    # the choice is remembered per visitor. cadasto.css defines both schemes.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  # Fonts are loaded by hand via `extra_css` below rather than by the theme, so
  # that all three families arrive in one request with `display=optional`. The
  # theme's own loader hardcodes `display=fallback`, which swaps the face in
  # after first paint and reflows the page.
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    # Folds the page's table of contents into the left sidebar and drops the
    # right-hand column, so a page has one navigation surface rather than two.
    - toc.integrate

extra_css:
  # One stylesheet for all three families. `display=optional` is what removes
  # the flash: the browser gives the font ~100ms, and if it misses that window
  # it keeps the fallback for this page load instead of swapping mid-render.
  # The `privacy` plugin rewrites this to a self-hosted copy at build time.
  - https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=optional
  - stylesheets/cadasto.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cadasto/openehr-assistant-mcp
    - icon: fontawesome/solid/globe
      link: https://www.cadasto.com
  generator: false

copyright: Cadasto B.V. · MIT License

nav:
  - Home: index.md
  - Features: features.md
  - Components: components.md
  - Install: install.md
  - Use cases: use-cases.md
  - Contributing: contributing.md

plugins:
  - search
  # Generates the Open Graph and Twitter card tags, and renders a preview image
  # per page. Without it a link to this site shared anywhere renders bare.
  # `font_family` must be named explicitly: the plugin normally reads it from
  # `theme.font`, which is false here because fonts are loaded by hand.
  - social:
      cards_layout_options:
        font_family: Roboto
        background_color: "#070e2b"
        color: "#ffffff"
  # Downloads the Google Fonts stylesheet and its woff2 files at build time and
  # rewrites the references to local copies, so the published site issues no
  # third-party requests. Listed after `social`, so anything that plugin emits
  # is also localised.
  - privacy

markdown_extensions:
  # Renders `:material-xxx:` shortcodes as inline SVG from the theme's bundled
  # icon sets — no sprite sheet and no third-party request.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Pulls in the product repos' canonical docs, fetched by `make sync`
  # into `.fetched/`. `check_paths` makes a missing include fail the build.
  - pymdownx.snippets:
      base_path: ['.fetched']
      check_paths: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
