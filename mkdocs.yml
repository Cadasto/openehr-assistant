site_name: openEHR Assistant
site_url: https://cadasto.github.io/openehr-assistant/
# Fallback only: every page in `nav` carries its own `description` front matter,
# which the theme and the social-card generator both prefer. This is what a page
# added without one would inherit, and what 404.html shows.
site_description: >-
  An openEHR MCP server and a Claude Code and Cursor plugin — archetypes,
  templates, AQL and terminology, grounded in CKM and the published
  specifications.
# The repository surfaced in the header (and its stars/forks) is the product's,
# not this site's — a visitor following it wants the server, not the prose. The
# site's own repository is linked from Contributing.
repo_url: https://github.com/cadasto/openehr-assistant-mcp
repo_name: cadasto/openehr-assistant-mcp
# No `edit_uri`: the theme only renders edit links with the `content.action.edit`
# feature, and pages built from fetched content would point at the wrong repo.

docs_dir: pages

# Warnings are build failures. Both `make build` and CI rely on this rather
# than passing --strict, so the two can never diverge.
strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # Dark is the default (listed first); on documentation pages the header
    # toggle switches to light and the choice is remembered per visitor. Fetched
    # tokens.css defines both scheme blocks, and `check` asserts both.
    #
    # Two known gaps in the light scheme, both fixable only in
    # Cadasto/docs-theme followed by a `theme.ref` bump:
    #   - The landing page has no toggle and stays dark. Material keeps the
    #     palette form and its localStorage restore script in
    #     partials/header.html, and the fetched home.html replaces that block
    #     wholesale — so index.html renders slate whatever the visitor chose.
    #   - The light scheme reuses the brand accents unchanged, and they were
    #     tuned for the navy surface: on white, --cadasto-blue (body links) is
    #     2.27:1 and --cadasto-green (link hover) 1.71:1, against a WCAG AA
    #     floor of 4.5:1. Both pass on navy (6.85:1, 9.05:1).
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  # Fonts are loaded by hand via `extra_css` below because the theme's own
  # loader cannot express this brand at all. Verified in
  # squidfunk/mkdocs-material:9.7.6 `templates/base.html`:
  #   - it binds two families only (`font.text`, `font.code`), so the Fira Sans
  #     display face has nowhere to go;
  #   - it calls the Google Fonts *v1* API with a hardcoded
  #     `300,300i,400,400i,700,700i` weight set, which excludes the 500 the
  #     brand headings use;
  #   - it hardcodes `&display=fallback`.
  # Any of those three alone rules the setting out, so this is not revertible.
  # `display=swap` below: the brand face is what the page is designed around, so
  # a first-load flash beats rendering that first page in Helvetica. (Unlike
  # `optional`, which keeps the fallback for that one page load and then uses
  # the cached face on later navigations.)
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    # Folds the page's table of contents into the left sidebar and drops the
    # right-hand column, so a page has one navigation surface rather than two.
    - toc.integrate

extra_css:
  # One stylesheet for all three families. The `privacy` plugin rewrites this to
  # a self-hosted copy at build time, so the published site issues no
  # third-party request; `check` asserts the absence of the remote URLs *and*
  # the presence of the localised sheet, because the first assertion passes
  # vacuously on its own. The weight list is load-bearing and coupled to the
  # fetched CSS: it uses Fira Sans at 500 and 700 only, so a weight added here
  # ships unused woff2 subsets and a weight dropped gets a synthesised face.
  # See `theme.font` above for why the theme's loader is bypassed.
  - https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap
  # Brand layer from Cadasto/docs-theme at the tag pinned in sources.json
  # (`make sync` writes these). Do not edit them here.
  - stylesheets/tokens.css
  - stylesheets/material.css
  - stylesheets/landing.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cadasto/openehr-assistant-mcp
    - icon: fontawesome/solid/globe
      link: https://www.cadasto.com
  generator: false

copyright: Cadasto B.V. · MIT License

nav:
  - Home: index.md
  - Features: features.md
  - Components: components.md
  - Install: install.md
  - Use cases: use-cases.md
  - Contributing: contributing.md
  - Contact: contact.md

plugins:
  - search
  # Generates the Open Graph and Twitter card tags, and renders a preview image
  # per page. Without it a link to this site shared anywhere renders bare.
  # `font_family` is pinned, not required: the plugin reads it from `theme.font`
  # when that is a mapping and otherwise falls through to its own "Roboto"
  # default, which is this same value. Naming it means a change to that default
  # cannot quietly restyle the cards. Cards use the body face, not Fira Sans.
  - social:
      cards_layout_options:
        font_family: Roboto
        background_color: "#070e2b"
        color: "#ffffff"
  # Downloads the Google Fonts stylesheet and its woff2 files at build time and
  # rewrites the references to local copies, so the published site issues no
  # third-party requests. Listed after `social`, so anything that plugin emits
  # is also localised.
  - privacy

markdown_extensions:
  # Renders `:material-xxx:` shortcodes as inline SVG from the theme's bundled
  # icon sets — no sprite sheet and no third-party request.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Pulls in the product repos' canonical docs, fetched by `make sync`
  # into `.fetched/`. `check_paths` makes a missing include fail the build.
  - pymdownx.snippets:
      base_path: ['.fetched']
      check_paths: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
